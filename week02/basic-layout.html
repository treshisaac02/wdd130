<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basic HTML Structure</title>
  <meta name="description" content="A basic HTML structure example using semantic HTML elements">
  <meta name="author" content="Isaac Edward Oko-Jaja">
</head>
<body>
  <header>
    <img src="images/basic-logo.png" alt="HTML Layout Logo" width="128" height="128">
  </header>
  <nav>
    <ul>
      <li><a href="https://byui.edu">BYU-Idaho</a></li>
      <li><a href="https://churchofjesuschrist.org">The Church</a></li>
    </ul>
  </nav>
  <main>
    <h1>Basic HTML Structure</h1>
    <section>
      <h2>Heading</h2>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nunc vitae sem sed quam.</p>
    </section>
    <section>
      <h2>Another Heading</h2>
      <p>Praesent commodo cursus magna, vel scelerisque nisl consectetur et. Donec sed odio.</p>
    </section>
  </main>
  <aside>
    <img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/payson-utah/800x500/payson-utah-temple-celestial-room-1458545.jpg" alt="Payson Utah Temple Celestial Room" width="200">
  </aside>
  <footer>
    <p>Isaac Edward Oko-Jaja</p>
  </footer>
</body>
</html>
